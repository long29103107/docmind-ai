services:
  database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: docmind
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: docmind-local-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - docmind-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmind -d docmind"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  docmind-database:
    name: backend_docmind-database
