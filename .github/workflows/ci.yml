name: DocMind CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify backend and frontend
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - name: Run shared verification
        shell: pwsh
        run: ./backend/scripts/verify.ps1

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: bun run build
